
# GitHub Actions workflow

name: Global Food Waste API - CI Pipeline

# Run the pipeline on pushes and pull requests to main
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Restrict permissions to reading repository contents
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Install Python on runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run automated API tests
      - name: Run automated tests
        run: python -m pytest -v

      # Step 5: Build Docker image after tests pass
      - name: Build Docker image
        run: docker build -t global-waste-api:${{ github.sha }} .
